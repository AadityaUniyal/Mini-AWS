# =============================================
#   MiniCloud — Cloud Platform Configuration
#   Database: Neon PostgreSQL
#   Frontend: Java Swing Desktop + REST API
#   Security: JWT (JJWT 0.12.x)
# =============================================

# ── Server Configuration ────
server.port=8080

# ── Neon PostgreSQL Database Connection ────
spring.datasource.url=jdbc:postgresql://ep-wispy-lab-apla5k4t.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_Hohp8aYBU2sj
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate Configuration ────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── JWT Configuration ────
minicloud.jwt.secret=MiniCloudSuperSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong!!
minicloud.jwt.expiry-ms=86400000

# ── File Upload Limits (for S3-like storage) ────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# ── Disable JMX to reduce memory ────
spring.jmx.enabled=false

# ── Storage Configuration ────
minicloud.storage.base-path=minicloud-data/storage
minicloud.lambda.tmp-dir=minicloud-data/lambda-tmp

# ── Auto-scaling Configuration ────
minicloud.autoscaling.scale-up-threshold=80.0
minicloud.autoscaling.scale-down-threshold=30.0
minicloud.autoscaling.scale-down-cooldown-samples=10
minicloud.autoscaling.min-replicas=1
minicloud.autoscaling.max-replicas=10
minicloud.autoscaling.eval-interval-ms=60000

# ── Logging Configuration ────
logging.file.name=minicloud-data/logs/app.log
logging.level.root=WARN
logging.level.com.minicloud=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{28} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.max-size=10MB
logging.file.max-history=30

# ── Cache Configuration (Caffeine) ────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# ── Async Thread Pool ────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.scheduling.pool.size=2

# ── Graceful Shutdown ────
spring.lifecycle.timeout-per-shutdown-phase=15s

# ── Force UTF-8 Encoding (Windows compatibility) ────
spring.mandatory-file-encoding=UTF-8

# ── Actuator Endpoints ────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── SpringDoc OpenAPI ────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
