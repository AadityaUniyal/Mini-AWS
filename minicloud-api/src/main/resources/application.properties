# =============================================
#   MiniCloud — Cloud Platform Configuration
#   Database: H2 File-based (default, zero-install)
#   Switch to PostgreSQL: --spring.profiles.active=postgres
#   Frontend: Java Swing Desktop + REST API
#   Security: JWT (JJWT 0.12.x)
# =============================================

# ── Server Configuration ────
server.port=8080

# ── H2 Database (Default — zero-install, laptop-ready) ────
spring.datasource.url=jdbc:h2:file:./minicloud-data/db/miniclouddb;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── H2 Console (Development) ────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── JPA / Hibernate Configuration ────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway Database Migrations ────
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── JWT Configuration ────
minicloud.jwt.secret=MiniCloudSuperSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong!!
minicloud.jwt.expiry-ms=86400000

# ── File Upload Limits (for S3-like storage) ────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# ── Disable JMX to reduce memory ────
spring.jmx.enabled=false

# ── Storage Configuration ────
minicloud.storage.base-path=minicloud-data/storage
minicloud.lambda.tmp-dir=minicloud-data/lambda-tmp

# ── Auto-scaling Configuration ────
minicloud.autoscaling.scale-up-threshold=80.0
minicloud.autoscaling.scale-down-threshold=30.0
minicloud.autoscaling.scale-down-cooldown-samples=10
minicloud.autoscaling.min-replicas=1
minicloud.autoscaling.max-replicas=10
minicloud.autoscaling.eval-interval-ms=60000

# ── Logging Configuration ────
logging.file.name=minicloud-data/logs/app.log
logging.level.root=WARN
logging.level.com.minicloud=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{28} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.file.max-size=10MB
logging.file.max-history=30

# ── Cache Configuration (Caffeine) ────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# ── Async Thread Pool ────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.scheduling.pool.size=2

# ── Graceful Shutdown ────
spring.lifecycle.timeout-per-shutdown-phase=15s

# ── Force UTF-8 Encoding (Windows compatibility) ────
spring.mandatory-file-encoding=UTF-8

# ── Actuator Endpoints ────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── SpringDoc OpenAPI ────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
