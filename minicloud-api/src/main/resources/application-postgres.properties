# =============================================
#   MiniCloud — PostgreSQL Profile
#   Activate: --spring.profiles.active=postgres
# =============================================

# ── PostgreSQL Database Connection ────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minicloud_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# ── JPA PostgreSQL Overrides ────
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── Flyway for PostgreSQL ────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── Disable H2 Console ────
spring.h2.console.enabled=false
