[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minicloud-cli"
version = "1.0.0"
description = "Ergonomic CLI utility for MINI-AWS (MiniCloud) Cloud Platform"
authors = [{ name = "MiniCloud Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
]

[project.scripts]
minicloud = "minicloud.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
