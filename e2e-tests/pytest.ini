[pytest]
testpaths = tier1_features tier2_boundaries tier3_combinations tier4_scenarios
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 Feature Coverage Tests (R1-R5 primary functional validation)
    tier2: Tier 2 Boundary & Corner Case Tests
    tier3: Tier 3 Cross-Feature Combination & Integration Flow Tests
    tier4: Tier 4 Real-World End-to-End Application Scenarios
    r1: Docker Compose and container setup tests
    r2: S3-to-Lambda event trigger and WebSocket streaming tests
    r3: Cost and rightsizing advisor telemetry tests
    r4: Chaos engineering and self-healing resilience tests
    r5: Interactive Python CLI tests
    slow: Tests that take longer than 2 seconds to execute
addopts = -v --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
